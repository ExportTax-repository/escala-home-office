<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escala Home Office · ADM</title>
<link rel="icon" type="image/png" href="assets/adm-logo.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="page">
    <div class="topline">
        <p class="classification">Classificação: <strong>Uso interno</strong></p>
        <img class="logo" src="assets/adm-logo.png" alt="ADM">
    </div>

    <div class="section-mark" aria-hidden="true"><span class="num">1</span><span class="txt">Escala de home office</span></div>
    <h1 id="pageTitle">Quem está em home office</h1>
    <p class="lead" id="pageLead"></p>

    <div class="toolbar" role="search">
        <label class="field">
            <span>Time</span>
            <select id="filterTeam"></select>
        </label>
        <label class="field">
            <span>Destacar pessoa</span>
            <div class="search-wrap">
                <input id="personSearch" list="peopleNames" placeholder="Digite um nome" autocomplete="off">
                <button type="button" class="search-clear" id="personSearchClear" aria-label="Limpar destaque" hidden>×</button>
            </div>
            <datalist id="peopleNames"></datalist>
        </label>
        <label class="field">
            <span>Ano</span>
            <select id="yearSelect"></select>
        </label>
        <span class="spacer"></span>
        <button type="button" class="btn btn-secondary" id="printBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2"/><path d="M6 14h12v7H6z"/></svg>
            Imprimir
        </button>
    </div>

    <section class="today" aria-labelledby="todayDate">
        <div class="card today-main" id="todayCard"></div>
    </section>

    <div class="section-mark" aria-hidden="true"><span class="num">2</span><span class="txt">Calendário</span></div>
    <div class="cal-head">
        <h2 id="calTitle">Escala do mês</h2>
        <ul class="legend">
            <li><span class="swatch verde"></span>Grupo Verde em home office</li>
            <li><span class="swatch amarelo"></span>Grupo Amarelo em home office</li>
            <li><span class="swatch branco"></span>Fixos não entram no rodízio</li>
        </ul>
    </div>
    <div class="month-tabs" role="tablist" aria-label="Mês" id="monthTabs"></div>
    <div id="calendar"></div>

    <footer class="footer">
        <div class="footer-line">
            <span><strong>ADM</strong> · <span id="footerOrg">Escala de home office</span></span>
        </div>
        <img class="stripe" src="assets/faixa-adm.jpg" alt="">
    </footer>
</div>

<!-- Ordem importa: configuração → regras → dados → interface → aplicação -->
<script src="js/config.js"></script>
<script src="js/escala.js"></script>
<script src="js/dados.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
